<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدير أعمالي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #14130f; font-family: 'Tajawal', sans-serif; color: #EDE9E0; display: flex; justify-content: center; padding: 32px 16px; min-height: 100vh; }
  #app { position: relative; width: 100%; max-width: 920px; overflow: hidden; border-radius: 32px; padding: 36px 42px; background: #1E1C17; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  svg.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .content { position: relative; z-index: 1; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .eyebrow { font-size: 12px; letter-spacing: 1px; color: #9B9488; margin-bottom: 4px; }
  h1 { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 30px; margin: 0; color: #D9B34A; }
  .dateBadge { display: flex; align-items: center; gap: 7px; background: rgba(37,36,32,0.7); padding: 8px 16px; border-radius: 30px; font-size: 12px; color: #B8B2A4; backdrop-filter: blur(4px); white-space: nowrap; }
  .divider { height: 1px; width: 100%; background: linear-gradient(90deg, transparent, #C9A227, transparent); opacity: 0.3; margin-bottom: 4px; }
  .quoteCard { position: relative; background: rgba(37,36,32,0.72); border-radius: 26px; padding: 36px 42px; margin: 20px 0 26px; text-align: center; backdrop-filter: blur(6px); }
  .quoteText { font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 15px; line-height: 2; }
  .quoteSrc { margin-top: 14px; font-size: 12px; color: #D9B34A; font-weight: 700; }
  .tabs { display: flex; gap: 6px; margin-bottom: 22px; background: rgba(37,36,32,0.7); padding: 5px; border-radius: 30px; }
  .tabBtn { flex: 1; padding: 10px 6px; background: transparent; border: none; border-radius: 24px; color: #B8B2A4; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; transition: background .25s, color .25s; }
  .tabBtn.active { background: #3A3833; color: #D9B34A; }
  .card { background: rgba(37,36,32,0.7); border-radius: 26px; padding: 22px; margin-bottom: 18px; backdrop-filter: blur(6px); }
  .sectionTitle { font-weight: 700; font-size: 14px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  input, select, textarea { font-family: 'Tajawal', sans-serif; background: rgba(30,28,23,0.8); border: none; border-radius: 20px; padding: 11px 16px; color: #EDE9E0; font-size: 13.5px; }
  textarea { border-radius: 18px; width: 100%; resize: vertical; min-height: 70px; font-size: 13px; line-height: 1.7; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #C9A227; outline-offset: 1px; }
  .addRowSecondary { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; margin-top: 12px; }
  .addRowSecondary select { flex: 1; min-width: 100px; }
  .addBtn { background: #D9B34A; border: none; border-radius: 20px; padding: 0 18px; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #1E1C17; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 13px; }
  .ghostBtn { background: rgba(201,162,39,0.12); border: 1px solid rgba(201,162,39,0.35); border-radius: 20px; padding: 7px 14px; cursor: pointer; color: #D9B34A; font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 12px; }
  .targetWrap { display: flex; align-items: center; gap: 8px; background: rgba(30,28,23,0.8); border-radius: 20px; padding: 0 14px; }
  .targetWrap input { width: 40px; background: transparent; padding: 11px 0; text-align: center; }
  .targetSuffix { font-size: 12px; color: #8A8478; white-space: nowrap; }
  .list { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; }
  .goalsGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .taskRow, .goalItemRow { display: flex; align-items: center; gap: 12px; background: rgba(37,36,32,0.7); border-radius: 22px; padding: 13px 18px; }
  .checkbox { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #55524A; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; background: transparent; font-size: 12px; }
  .checkbox.done { background: #C9A227; border-color: #C9A227; color: #1E1C17; }
  .taskTitle { flex: 1; font-size: 14px; }
  .catChip { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; flex-shrink: 0; }
  .prioFlag { font-size: 13px; flex-shrink: 0; }
  .deleteBtn { background: transparent; border: none; cursor: pointer; padding: 4px; display: flex; flex-shrink: 0; color: #B8B2A4; }
  .empty { color: #8A8478; font-size: 13px; padding: 24px 4px; text-align: center; }
  .tallyRow { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; background: rgba(37,36,32,0.7); border-radius: 22px; padding: 12px 18px; }
  .tallyMark { width: 11px; height: 24px; border-radius: 6px; }
  .tallyLabel { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B8B2A4; margin-right: auto; }
  .totalsRow { display: flex; gap: 20px; margin-top: 16px; font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .goalRow { margin-bottom: 18px; }
  .goalTop { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; gap: 8px; flex-wrap: wrap; }
  .goalName { font-weight: 700; }
  .streakTag { font-size: 11px; color: #D9B34A; font-weight: 700; }
  .goalStatus { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .progressTrack { height: 9px; background: rgba(30,28,23,0.8); border-radius: 20px; overflow: hidden; }
  .progressFill { height: 100%; border-radius: 20px; transition: width .4s; }
  .summaryGrid { display: flex; justify-content: space-between; gap: 12px; }
  .summaryLabel { font-size: 12px; color: #8A8478; margin-bottom: 6px; }
  .summaryNum { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; color: #D9B34A; }
  .goalTargetTag { font-size: 12px; color: #8A8478; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
  .hidden { display: none; }
  .fullInput { width: 100%; margin-bottom: 12px; }
  .chartsRow { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 720px) { .chartsRow { grid-template-columns: 1.4fr 1fr; } }
  .noteBlock { border-bottom: 1px solid rgba(255,255,255,0.06); padding: 10px 0; font-size: 13px; color: #C9C4B8; }
  .noteBlock:last-child { border-bottom: none; }
  .noteDay { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A8478; margin-bottom: 4px; }
  .archiveHeader { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }

  /* ============ تحسينات الجوال ============ */
  @media (max-width: 768px) {
    body { padding: 12px 8px; }
    #app { border-radius: 20px; padding: 18px 14px; }
    h1 { font-size: 22px; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .dateBadge { font-size: 11px; padding: 6px 12px; }
    .quoteCard { padding: 22px 18px; border-radius: 18px; margin: 14px 0 18px; }
    .quoteText { font-size: 13.5px; line-height: 1.9; }
    .quoteSrc { font-size: 11px; }
    .tabs { gap: 3px; padding: 4px; border-radius: 22px; }
    .tabBtn { font-size: 11px; padding: 9px 3px; border-radius: 18px; }
    .card { padding: 16px 14px; border-radius: 18px; margin-bottom: 14px; }
    .sectionTitle { font-size: 13px; margin-bottom: 12px; }
    input, select, textarea { font-size: 13px; padding: 10px 13px; border-radius: 16px; }
    .addRowSecondary { gap: 8px; }
    .addRowSecondary select { min-width: 80px; font-size: 12px; }
    .addBtn { padding: 10px 16px; font-size: 12.5px; border-radius: 16px; justify-content: center; }
    .fullInput { margin-bottom: 10px; }
    .taskRow, .goalItemRow { gap: 9px; padding: 11px 13px; border-radius: 16px; }
    .taskTitle { font-size: 13px; }
    .checkbox { width: 20px; height: 20px; }
    .catChip { font-size: 10px; padding: 3px 8px; }
    .goalsGrid { grid-template-columns: 1fr; }
    .list { max-height: none; }
    .tallyRow { padding: 10px 14px; border-radius: 16px; gap: 5px; }
    .tallyMark { width: 9px; height: 20px; }
    .tallyLabel { font-size: 11px; }
    .summaryGrid { flex-wrap: wrap; gap: 14px; }
    .summaryNum { font-size: 20px; }
    .summaryLabel { font-size: 11px; }
    .totalsRow { gap: 14px; font-size: 12px; flex-wrap: wrap; }
    .goalTop { font-size: 12px; }
    .chartsRow { gap: 14px; }
    canvas { max-width: 100% !important; }
    .noteBlock { font-size: 12.5px; }
    .archiveHeader { gap: 8px; }
    .ghostBtn { font-size: 11px; padding: 6px 12px; }
  }

  @media (max-width: 400px) {
    h1 { font-size: 19px; }
    .tabBtn { font-size: 10px; }
    .quoteText { font-size: 12.5px; }
    .summaryNum { font-size: 18px; }
    .addRowSecondary { flex-direction: column; }
    .addRowSecondary select, .addBtn { width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <svg class="backdrop" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect width="100" height="100" fill="#242220"/>
    <path d="M30,0 L100,0 L100,100 L30,100 C30,92.85 27,92.85 27,85.7 C27,78.55 34,78.55 34,71.4 C34,64.25 27,64.25 27,57.1 C27,50 34,50 34,42.9 C34,35.75 27,35.75 27,28.6 C27,21.45 34,21.45 34,14.3 C34,7.15 30,7.15 30,0 Z" fill="#EDE7D8"/>
    <line x1="88" y1="3" x2="88" y2="97" stroke="#8A7A55" stroke-opacity="0.25" stroke-width="0.15"/>
  </svg>
  <svg class="backdrop" width="230" height="230" viewBox="0 0 260 260" style="position:absolute; top:50%; left:14px; transform:translateY(-50%); opacity:0.9; width:230px; height:230px;">
    <g stroke="#C9A227" fill="none" id="petalGroup"></g>
    <circle cx="130" cy="130" r="4" fill="#C9A227" opacity="0.8"/>
  </svg>

  <div class="content">
    <div class="header">
      <div>
        <div class="eyebrow">سجل الأداء اليومي</div>
        <h1>مدير أعمالي</h1>
      </div>
      <div class="dateBadge" id="dateBadge"></div>
    </div>

    <div class="divider"></div>

    <div class="quoteCard">
      <div class="quoteText" id="quoteText"></div>
      <div class="quoteSrc" id="quoteSrc"></div>
    </div>

    <div class="tabs">
      <button class="tabBtn active" data-tab="today">اليوم</button>
      <button class="tabBtn" data-tab="week">التقييم الأسبوعي</button>
      <button class="tabBtn" data-tab="goals">الأهداف</button>
      <button class="tabBtn" data-tab="archive">الأرشيف</button>
    </div>

    <div id="tab-today">
      <div class="tallyRow" id="tallyRow"></div>
      <div class="card">
        <input class="fullInput" id="newTitle" placeholder="أضف إنجاز أو مهمة اليوم..." />
        <div class="addRowSecondary">
          <select id="newCat">
            <option value="شخصي">شخصي</option>
            <option value="شغل">شغل</option>
          </select>
          <select id="newGoalId"><option value="">بدون هدف</option></select>
          <select id="newPriority">
            <option value="عادي">أولوية عادية</option>
            <option value="مهم">مهم 🔥</option>
          </select>
          <button class="addBtn" id="addTaskBtn">+ إضافة</button>
        </div>
      </div>
      <div class="list" id="todayList"></div>
      <div class="card" style="margin-top:18px">
        <div class="sectionTitle">ملاحظة اليوم</div>
        <textarea id="todayNote" placeholder="كيف كان يومك؟ أي شي حابب تسجله..."></textarea>
      </div>
    </div>

    <div id="tab-week" class="hidden">
      <div class="chartsRow">
        <div class="card">
          <div class="sectionTitle">الإنجاز اليومي — آخر 7 أيام</div>
          <canvas id="weekChart" height="200"></canvas>
          <div class="totalsRow" id="weekTotals"></div>
        </div>
        <div class="card">
          <div class="sectionTitle">شخصي مقابل شغل</div>
          <canvas id="pieChart" height="200"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="sectionTitle">
          <span>مقارنة الأهداف بالخطوات الفعلية</span>
          <button class="ghostBtn" id="exportBtn">تصدير الأسبوع</button>
        </div>
        <div id="goalProgressList"></div>
      </div>
      <div class="card">
        <div class="sectionTitle">الخلاصة</div>
        <div class="summaryGrid" id="summaryGrid"></div>
      </div>
      <div class="card">
        <div class="sectionTitle">ملاحظات الأسبوع</div>
        <div id="weekNotes"></div>
      </div>
    </div>

    <div id="tab-goals" class="hidden">
      <div class="card">
        <div class="sectionTitle">هدف جديد</div>
        <input class="fullInput" id="goalTitle" placeholder="اسم الهدف (مثلاً: قراءة، رياضة، مهمة عمل)" />
        <div class="addRowSecondary">
          <select id="goalCat">
            <option value="شخصي">شخصي</option>
            <option value="شغل">شغل</option>
          </select>
          <div class="targetWrap">
            <input id="goalTarget" type="number" min="1" value="5" />
            <span class="targetSuffix">مرة / أسبوع</span>
          </div>
          <button class="addBtn" id="addGoalBtn">+ إضافة</button>
        </div>
      </div>
      <div class="goalsGrid" id="goalsList"></div>
    </div>

    <div id="tab-archive" class="hidden">
      <div class="card">
        <div class="archiveHeader">
          <span class="sectionTitle" style="margin:0">تصفح يوم سابق</span>
          <input type="date" id="archiveDate" />
        </div>
        <div class="tallyRow" id="archiveTally"></div>
        <div class="list" id="archiveList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const CATS = { "شخصي": "#C9A227", "شغل": "#8FA6B8" };

const QUOTES = [
  { text: "احرص على ما ينفعك، واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل: لو أني فعلت كان كذا، ولكن قل: قدر الله وما شاء فعل", src: "حديث — رواه مسلم" },
  { text: "نعمتان مغبون فيهما كثير من الناس: الصحة، والفراغ", src: "حديث — رواه البخاري" },
  { text: "كن في الدنيا كأنك غريب أو عابر سبيل", src: "حديث — رواه البخاري" },
  { text: "إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء، وخذ من صحتك لمرضك، ومن حياتك لموتك", src: "عبد الله بن عمر — رواه البخاري" },
  { text: "حاسبوا أنفسكم قبل أن تحاسبوا، وزنوا أعمالكم قبل أن توزن عليكم", src: "عمر بن الخطاب رضي الله عنه" },
  { text: "من سلك طريقاً يلتمس فيه علماً سهّل الله له به طريقاً إلى الجنة", src: "حديث — رواه مسلم" },
  { text: "إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى", src: "حديث — رواه البخاري ومسلم" },
  { text: "إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم", src: "حديث — رواه مسلم" },
  { text: "المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير", src: "حديث — رواه مسلم" },
  { text: "ابن آدم، إنما أنت أيام، فإذا ذهب يومك ذهب بعضك", src: "منسوب إلى الحسن البصري رحمه الله" },
  { text: "ما ندمت على شيء ندمي على يوم غربت شمسه، نقص فيه عمري، ولم يزد فيه عملي", src: "عبد الله بن مسعود رضي الله عنه" },
  { text: "إن الله كتب الإحسان على كل شيء", src: "حديث — رواه مسلم" },
];

function uid() { return Math.random().toString(36).slice(2, 10); }
function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function last7Dates() { return Array.from({ length: 7 }, (_, i) => todayStr(-(6 - i))); }
function dayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("ar", { weekday: "short", day: "numeric" });
}

function loadGoals() { try { return JSON.parse(localStorage.getItem("dm_goals")) || []; } catch (e) { return []; } }
function saveGoals(g) { localStorage.setItem("dm_goals", JSON.stringify(g)); }
function loadDay(d) { try { return JSON.parse(localStorage.getItem("dm_entries_" + d)) || []; } catch (e) { return []; } }
function saveDay(d, tasks) { localStorage.setItem("dm_entries_" + d, JSON.stringify(tasks)); }
function loadNote(d) { return localStorage.getItem("dm_note_" + d) || ""; }
function saveNote(d, text) { localStorage.setItem("dm_note_" + d, text); }

let goals = loadGoals();
const today = todayStr(0);
const week = last7Dates();

const petalGroup = document.getElementById("petalGroup");
for (let i = 0; i < 12; i++) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("transform", `rotate(${i * 30} 130 130)`);
  const el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
  el.setAttribute("cx", "130"); el.setAttribute("cy", "66");
  el.setAttribute("rx", "15"); el.setAttribute("ry", "40");
  el.setAttribute("stroke-width", "1.1"); el.setAttribute("opacity", "0.55");
  g.appendChild(el); petalGroup.appendChild(g);
}
[[20,1,0.7],[34,0.8,0.5],[94,0.7,0.35],[104,0.5,0.22]].forEach(([r,w,o]) => {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx","130"); c.setAttribute("cy","130"); c.setAttribute("r", r);
  c.setAttribute("stroke-width", w); c.setAttribute("opacity", o);
  petalGroup.appendChild(c);
});
for (let i = 0; i < 16; i++) {
  const a = (i * 360) / 16, rad = (a * Math.PI) / 180;
  const x = 130 + 99 * Math.cos(rad), y = 130 + 99 * Math.sin(rad);
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", "2.4");
  c.setAttribute("fill", "#C9A227"); c.setAttribute("stroke", "none"); c.setAttribute("opacity", "0.5");
  petalGroup.appendChild(c);
}

document.getElementById("dateBadge").textContent = new Date().toLocaleDateString("ar", { weekday: "long", day: "numeric", month: "long" });
const dayIndex = Math.floor(Date.now() / 86400000);
const quote = QUOTES[dayIndex % QUOTES.length];
document.getElementById("quoteText").textContent = '"' + quote.text + '"';
document.getElementById("quoteSrc").textContent = quote.src;

document.querySelectorAll(".tabBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabBtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ["today", "week", "goals", "archive"].forEach(t => document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab));
    if (btn.dataset.tab === "week") renderWeek();
    if (btn.dataset.tab === "archive") renderArchive();
  });
});

function refreshGoalSelect() {
  const cat = document.getElementById("newCat").value;
  const sel = document.getElementById("newGoalId");
  sel.innerHTML = '<option value="">بدون هدف</option>' + goals.filter(g => g.category === cat).map(g => `<option value="${g.id}">${g.title}</option>`).join("");
}
document.getElementById("newCat").addEventListener("change", refreshGoalSelect);

function taskRowHtml(t, dateForActions) {
  const flag = t.priority === "مهم" ? '<span class="prioFlag" title="مهم">🔥</span>' : "";
  return `
    <div class="taskRow">
      <button class="checkbox ${t.completed ? "done" : ""}" onclick="toggleTask('${dateForActions}','${t.id}')">${t.completed ? "✓" : ""}</button>
      ${flag}
      <span class="taskTitle" style="text-decoration:${t.completed ? "line-through" : "none"}; opacity:${t.completed ? 0.55 : 1}">${t.title}</span>
      <span class="catChip" style="background:${CATS[t.category]}22; color:${CATS[t.category]}">${t.category}</span>
      <button class="deleteBtn" onclick="deleteTask('${dateForActions}','${t.id}')">🗑</button>
    </div>`;
}

function renderToday() {
  const tasks = loadDay(today).sort((a,b) => (b.priority === "مهم") - (a.priority === "مهم"));
  const tally = document.getElementById("tallyRow");
  const n = Math.max(tasks.length, 6);
  let marks = "";
  for (let i = 0; i < n; i++) {
    const t = tasks[i];
    const bg = t ? (t.completed ? "#C9A227" : "#55524A") : "transparent";
    const border = t ? "none" : "1px dashed #55524A";
    marks += `<div class="tallyMark" style="background:${bg}; border:${border}"></div>`;
  }
  const done = tasks.filter(t => t.completed).length;
  tally.innerHTML = marks + `<span class="tallyLabel">${done} / ${tasks.length} أنجزتها اليوم</span>`;

  const list = document.getElementById("todayList");
  list.innerHTML = tasks.length === 0 ? `<div class="empty">لسا ما أضفت شي اليوم. ابدأ بأول إنجاز.</div>` : tasks.map(t => taskRowHtml(t, today)).join("");
  refreshGoalSelect();
  document.getElementById("todayNote").value = loadNote(today);
}

function toggleTask(date, id) {
  const tasks = loadDay(date).map(t => t.id === id ? { ...t, completed: !t.completed } : t);
  saveDay(date, tasks);
  if (date === today) renderToday(); else renderArchive();
}
function deleteTask(date, id) {
  saveDay(date, loadDay(date).filter(t => t.id !== id));
  if (date === today) renderToday(); else renderArchive();
}

document.getElementById("addTaskBtn").addEventListener("click", () => {
  const titleEl = document.getElementById("newTitle");
  const title = titleEl.value.trim();
  if (!title) return;
  const task = { id: uid(), title, category: document.getElementById("newCat").value, goalId: document.getElementById("newGoalId").value || null, priority: document.getElementById("newPriority").value, completed: false };
  const tasks = loadDay(today);
  tasks.push(task);
  saveDay(today, tasks);
  titleEl.value = "";
  renderToday();
});
document.getElementById("newTitle").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("addTaskBtn").click(); });
document.getElementById("todayNote").addEventListener("input", e => saveNote(today, e.target.value));

function computeStreak(goalId) {
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = todayStr(-i);
    const hit = loadDay(d).some(t => t.goalId === goalId && t.completed);
    if (hit) streak++; else break;
  }
  return streak;
}

let weekChartInstance = null, pieChartInstance = null;
function renderWeek() {
  const weekData = week.map(d => {
    const tasks = loadDay(d);
    return { day: dayLabel(d), شخصي: tasks.filter(t => t.category === "شخصي" && t.completed).length, شغل: tasks.filter(t => t.category === "شغل" && t.completed).length };
  });
  const totals = { شخصي: weekData.reduce((s, d) => s + d.شخصي, 0), شغل: weekData.reduce((s, d) => s + d.شغل, 0) };
  document.getElementById("weekTotals").innerHTML = `<span style="color:${CATS["شخصي"]}">شخصي: ${totals.شخصي}</span><span style="color:${CATS["شغل"]}">شغل: ${totals.شغل}</span>`;

  const ctx = document.getElementById("weekChart").getContext("2d");
  if (weekChartInstance) weekChartInstance.destroy();
  weekChartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: weekData.map(d => d.day),
      datasets: [
        { label: "شخصي", data: weekData.map(d => d.شخصي), backgroundColor: CATS["شخصي"], stack: "a", borderRadius: 4 },
        { label: "شغل", data: weekData.map(d => d.شغل), backgroundColor: CATS["شغل"], stack: "a", borderRadius: 4 },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: "#B8B2A4", font: { family: "Tajawal" } } } },
      scales: {
        x: { stacked: true, ticks: { color: "#B8B2A4" }, grid: { color: "#3A3833" } },
        y: { stacked: true, ticks: { color: "#B8B2A4", precision: 0 }, grid: { color: "#3A3833" } }
      }
    }
  });

  const pctx = document.getElementById("pieChart").getContext("2d");
  if (pieChartInstance) pieChartInstance.destroy();
  pieChartInstance = new Chart(pctx, {
    type: "doughnut",
    data: {
      labels: ["شخصي", "شغل"],
      datasets: [{ data: [totals.شخصي, totals.شغل], backgroundColor: [CATS["شخصي"], CATS["شغل"]], borderWidth: 0 }]
    },
    options: { responsive: true, plugins: { legend: { position: "bottom", labels: { color: "#B8B2A4", font: { family: "Tajawal" } } } } }
  });

  const goalProgress = goals.map(g => {
    const actual = week.reduce((sum, d) => sum + loadDay(d).filter(t => t.goalId === g.id && t.completed).length, 0);
    const pct = g.weeklyTarget > 0 ? Math.round((actual / g.weeklyTarget) * 100) : 0;
    return { ...g, actual, pct, streak: computeStreak(g.id) };
  });
  const gpList = document.getElementById("goalProgressList");
  gpList.innerHTML = goalProgress.length === 0
    ? `<div class="empty">ما عندك أهداف بعد. أضف أهداف من تبويب "الأهداف".</div>`
    : goalProgress.map(g => `
      <div class="goalRow">
        <div class="goalTop">
          <span class="goalName">${g.title}</span>
          <span class="streakTag">${g.streak > 0 ? "🔥 " + g.streak + " يوم متتالي" : ""}</span>
          <span class="goalStatus" style="color:${g.pct >= 100 ? "#C9A227" : "#B36A4A"}">${g.actual} / ${g.weeklyTarget}</span>
        </div>
        <div class="progressTrack"><div class="progressFill" style="width:${Math.min(g.pct,100)}%; background:${g.pct >= 100 ? "#C9A227" : "#B36A4A"}"></div></div>
      </div>`).join("");

  document.getElementById("summaryGrid").innerHTML = `
    <div><div class="summaryLabel">أهداف محقّقة</div><div class="summaryNum">${goalProgress.filter(g => g.pct >= 100).length}</div></div>
    <div><div class="summaryLabel">أهداف متأخرة</div><div class="summaryNum" style="color:#B36A4A">${goalProgress.filter(g => g.pct < 100).length}</div></div>
    <div><div class="summaryLabel">إجمالي الإنجاز</div><div class="summaryNum">${totals.شخصي + totals.شغل}</div></div>`;

  const notesHtml = week.map(d => {
    const note = loadNote(d);
    return note ? `<div class="noteBlock"><div class="noteDay">${dayLabel(d)}</div>${note}</div>` : "";
  }).filter(Boolean).join("");
  document.getElementById("weekNotes").innerHTML = notesHtml || `<div class="empty">ما فيه ملاحظات مسجلة هالأسبوع.</div>`;

  window._weekExportData = { weekData, totals, goalProgress, notes: week.map(d => ({ day: dayLabel(d), note: loadNote(d) })) };
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = window._weekExportData;
  if (!data) return;
  let lines = [];
  lines.push("ملخص الأسبوع — مدير أعمالي");
  lines.push("=".repeat(30));
  data.weekData.forEach(d => lines.push(`${d.day}: شخصي ${d.شخصي} | شغل ${d.شغل}`));
  lines.push("");
  lines.push(`الإجمالي — شخصي: ${data.totals.شخصي} | شغل: ${data.totals.شغل}`);
  lines.push("");
  lines.push("الأهداف:");
  data.goalProgress.forEach(g => lines.push(`- ${g.title}: ${g.actual}/${g.weeklyTarget} (${g.pct}%)${g.streak > 0 ? " — ستريك " + g.streak + " يوم" : ""}`));
  const notesFilled = data.notes.filter(n => n.note);
  if (notesFilled.length) {
    lines.push("");
    lines.push("الملاحظات:");
    notesFilled.forEach(n => lines.push(`- ${n.day}: ${n.note}`));
  }
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ملخص_الأسبوع_" + today + ".txt";
  a.click();
});

function renderGoals() {
  const list = document.getElementById("goalsList");
  list.innerHTML = goals.length === 0
    ? `<div class="empty">أضف أول هدف أسبوعي لك.</div>`
    : goals.map(g => `
      <div class="goalItemRow">
        <span class="catChip" style="background:${CATS[g.category]}22; color:${CATS[g.category]}">${g.category}</span>
        <span class="taskTitle">${g.title}</span>
        <span class="goalTargetTag">${g.weeklyTarget}× أسبوعياً</span>
        <button class="deleteBtn" onclick="deleteGoal('${g.id}')">🗑</button>
      </div>`).join("");
}
function deleteGoal(id) { goals = goals.filter(g => g.id !== id); saveGoals(goals); renderGoals(); refreshGoalSelect(); }

document.getElementById("addGoalBtn").addEventListener("click", () => {
  const titleEl = document.getElementById("goalTitle");
  const title = titleEl.value.trim();
  if (!title) return;
  goals.push({ id: uid(), title, category: document.getElementById("goalCat").value, weeklyTarget: Number(document.getElementById("goalTarget").value) || 1 });
  saveGoals(goals);
  titleEl.value = "";
  document.getElementById("goalTarget").value = 5;
  renderGoals();
  refreshGoalSelect();
});

const archiveDateInput = document.getElementById("archiveDate");
archiveDateInput.value = today;
archiveDateInput.max = today;
archiveDateInput.addEventListener("change", renderArchive);
function renderArchive() {
  const d = archiveDateInput.value || today;
  const tasks = loadDay(d).sort((a,b) => (b.priority === "مهم") - (a.priority === "مهم"));
  const tally = document.getElementById("archiveTally");
  const n = Math.max(tasks.length, 6);
  let marks = "";
  for (let i = 0; i < n; i++) {
    const t = tasks[i];
    const bg = t ? (t.completed ? "#C9A227" : "#55524A") : "transparent";
    const border = t ? "none" : "1px dashed #55524A";
    marks += `<div class="tallyMark" style="background:${bg}; border:${border}"></div>`;
  }
  const done = tasks.filter(t => t.completed).length;
  tally.innerHTML = marks + `<span class="tallyLabel">${done} / ${tasks.length} من إنجازات هذا اليوم</span>`;
  const list = document.getElementById("archiveList");
  list.innerHTML = tasks.length === 0 ? `<div class="empty">ما فيه أي مهام مسجلة بهذا اليوم.</div>` : tasks.map(t => taskRowHtml(t, d)).join("");
}

renderToday();
renderGoals();
</script>
</body>
</html>
